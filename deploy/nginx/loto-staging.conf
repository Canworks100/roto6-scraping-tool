# ステージング用。検索に出さない（Disallow + X-Robots-Tag）
# stg.lottery-analytics.com — 本番の robots.txt / sitemap をコピーしない

server {
    listen 80;
    listen [::]:80;
    server_name stg.lottery-analytics.com;

    root /var/www/loto-stg;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # 旧 trends → freq
    location ~ ^/(loto6|loto7|miniloto)/trends/?$ {
        return 301 /$1/freq;
    }

    # /n/1 → /n/01
    location ~ ^/(loto6|loto7|miniloto)/n/([0-9])$ {
        return 301 /$1/n/0$2;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /404/index.html;
    }
}
