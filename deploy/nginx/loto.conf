# /etc/nginx/sites-available/loto.conf
# 本番: lottery-analytics.com（Conoha VPS）

limit_req_zone $binary_remote_addr zone=loto_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=loto_gen:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lottery-analytics.com www.lottery-analytics.com;
    return 301 https://lottery-analytics.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lottery-analytics.com;

    # ssl_certificate /etc/letsencrypt/live/lottery-analytics.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lottery-analytics.com/privkey.pem;

    return 301 https://lottery-analytics.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lottery-analytics.com;

    # ssl_certificate /etc/letsencrypt/live/lottery-analytics.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lottery-analytics.com/privkey.pem;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/loto-stg;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # GTM 実装確認が iframe で見るため DENY にしない。クリックジャッキングは frame-ancestors で制限。
    add_header Content-Security-Policy "frame-ancestors 'self' https://tagmanager.google.com https://*.tagmanager.google.com https://www.googletagmanager.com;" always;

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=loto_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(loto6|loto7|miniloto)/generate$ {
        limit_req zone=loto_gen burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 旧 trends → freq
    location ~ ^/(loto6|loto7|miniloto)/trends/?$ {
        return 301 /$1/freq;
    }

    # /n/1 → /n/01
    location ~ ^/(loto6|loto7|miniloto)/n/([0-9])$ {
        return 301 /$1/n/0$2;
    }

    # `/` → ロト6ハブ（静的ファイルがあればそれを優先）
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /404/index.html;
    }
}
